services:
  tollgate:
    container_name: tollgate
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080  # ポートマッピングと合わせて明示的に指定
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
      mock-server:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/livez || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-server:
    container_name: mock-server
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "9000:8000"

  dynamodb:
    image: amazon/dynamodb-local:2.4.0
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    profiles:
      - database

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-northeast-1
    profiles:
      - database
    depends_on:
      - dynamodb

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no  # 永続化なし (レートリミット用途)
    profiles:
      - database

  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        aws dynamodb describe-table --table-name TollgateAPIKeys --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 || \
        aws dynamodb create-table \
          --table-name TollgateAPIKeys \
          --endpoint-url http://dynamodb:8000 \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=tenant_id,AttributeType=S \
            AttributeName=created_at,AttributeType=S \
          --key-schema \
            AttributeName=pk,KeyType=HASH \
          --global-secondary-indexes \
            '[{"IndexName": "GSI_TenantKeys", "KeySchema": [{"AttributeName": "tenant_id", "KeyType": "HASH"}, {"AttributeName": "created_at", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}]' \
          --billing-mode PAY_PER_REQUEST
    profiles:
      - database
    depends_on:
      - dynamodb
