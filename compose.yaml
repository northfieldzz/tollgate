services:
  tollgate:
    container_name: tollgate
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-http://dynamodb:8000}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      TABLE_NAME: ${TABLE_NAME:-TollgateAPIKeys}
      PROXY_ROUTES: ${PROXY_ROUTES:-}
      ROUTES_CONFIG_FILE: ${ROUTES_CONFIG_FILE:-}
      FORWARD_TARGET_URL: ${FORWARD_TARGET_URL:-}
      DOCS_PATH: ${DOCS_PATH:-/docs}
      OPENAPI_PATH: ${OPENAPI_PATH:-/openapi}
      KEY_CACHE_TTL: ${KEY_CACHE_TTL:-10}
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/livez || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:2.4.0
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    profiles:
      - database

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=ap-northeast-1
    profiles:
      - database
    depends_on:
      - dynamodb

  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        aws dynamodb describe-table --table-name TollgateAPIKeys --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 || \
        aws dynamodb create-table \
          --table-name TollgateAPIKeys \
          --endpoint-url http://dynamodb:8000 \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=tenant_id,AttributeType=S \
            AttributeName=created_at,AttributeType=S \
          --key-schema \
            AttributeName=pk,KeyType=HASH \
          --global-secondary-indexes \
            '[{"IndexName": "GSI_TenantKeys", "KeySchema": [{"AttributeName": "tenant_id", "KeyType": "HASH"}, {"AttributeName": "created_at", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}]' \
          --billing-mode PAY_PER_REQUEST
    profiles:
      - database
    depends_on:
      - dynamodb
